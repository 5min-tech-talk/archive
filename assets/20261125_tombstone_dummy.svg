<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="800" height="370" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif">
  <rect width="800" height="370" fill="#ffffff" />

  
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Open Addressing Deletion: Why Tombstone (DUMMY) Is Needed</text>
  <text x="400" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">Scenario: "apple" and "melon" both hash to slot [0], so "melon" is placed in slot [1]. Then del d["apple"] runs.</text>

  
  <rect x="28" y="76" width="358" height="270" rx="10" fill="#fffafa" stroke="#fecaca" stroke-width="1.5" />
  <text x="207" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#dc2626">1. Without Tombstone (Set to None)</text>

  
  <rect x="65" y="130" width="70" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#64748b">[0]</text>
  <text x="100" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94a3b8">None</text>

  <rect x="145" y="130" width="110" height="44" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#2563eb">[1] (from 0)</text>
  <text x="200" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">"melon"</text>

  <rect x="265" y="130" width="70" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#64748b">[2]</text>
  <text x="300" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">None</text>

  
  <text x="100" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">get("melon")</text>
  <line x1="100" y1="202" x2="100" y2="180" stroke="#dc2626" stroke-width="2" />
  <polygon points="100,176 95,184 105,184" fill="#dc2626" />

  
  <rect x="52" y="236" width="310" height="88" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
  <text x="207" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">Probe Stops Early at [0]!</text>
  <text x="207" y="281" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Sees None -&gt; assumes "melon" doesn't exist.</text>
  <text x="207" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Raises KeyError (Bug!)</text>

  
  <rect x="414" y="76" width="358" height="270" rx="10" fill="#f7fee7" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="593" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#15803d">2. With Tombstone (DUMMY Marker)</text>

  
  <rect x="451" y="130" width="76" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="489" y="150" text-anchor="middle" font-size="11" fill="#b45309">[0]</text>
  <text x="489" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">DUMMY</text>

  <rect x="537" y="130" width="110" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="592" y="150" text-anchor="middle" font-size="11" fill="#15803d">[1] (from 0)</text>
  <text x="592" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">"melon"</text>

  <rect x="657" y="130" width="70" height="44" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="692" y="150" text-anchor="middle" font-size="11" fill="#64748b">[2]</text>
  <text x="692" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">None</text>

  
  <text x="489" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">get("melon")</text>
  <line x1="489" y1="202" x2="489" y2="180" stroke="#16a34a" stroke-width="2" />
  <polygon points="489,176 484,184 494,184" fill="#16a34a" />

  <path d="M 515 128 Q 540 110 568 128" fill="none" stroke="#16a34a" stroke-width="2" />
  <polygon points="571,130 562,128 567,121" fill="#16a34a" />

  
  <rect x="438" y="236" width="310" height="88" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1" />
  <text x="593" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Continues Probing to [1]!</text>
  <text x="593" y="281" text-anchor="middle" font-size="11.5" fill="#166534">DUMMY means "deleted slot, keep searching."</text>
  <text x="593" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Returns 5000 (Safe &amp; Reusable)</text>
</svg>